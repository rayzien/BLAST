[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blast"
version = "1.2.1"
description = "High-Performance Security, Queue, and Clustering Gateway for Supabase"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "redis>=5.0.0",
]

[project.scripts]
blast = "cli:main"

[tool.setuptools]
py-modules = ["cli", "main", "config", "logger", "server", "try_live", "persistence_manager"]
packages = ["security", "job_queue", "cluster", "mesh", "worker", "supabase", "sdk", "awake"]
